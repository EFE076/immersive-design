<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Strand - A-Frame</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="app2.js"></script>
</head>

<body>

<a-scene shadow="type: pcfsoft">

    <a-assets>
        <!-- 3D schelp -->
        <a-asset-item id="schelpModel" src="shell.glb"></a-asset-item>

        <!-- Schelp geluid -->
        <audio id="schelpGeluid" src="shell.mp3" preload="auto"></audio>
    </a-assets>


    <!-- Licht -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; castShadow: true" position="2 4 1"></a-entity>
    <a-entity light="type: point; intensity: 0.7; distance: 12" position="0 3 -2"></a-entity>


    <!-- Lucht -->
    <a-sky color="#87CEEB"></a-sky>


    <!-- Strand -->
    <a-plane
        position="0 0 -5"
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#E8C66A"
        shadow="receive: true">
    </a-plane>


    <!-- Zee -->
    <a-plane
        position="0 0.02 -13"
        rotation="-90 0 0"
        width="30"
        height="10"
        color="#249BD8"
        shadow="receive: true">
    </a-plane>


    <!-- Zon -->
    <a-sphere
        position="6 7 -15"
        radius="1.2"
        color="#FFD43B"
        shadow="cast: true">
    </a-sphere>


    <!-- Spotlight op de schelp -->
    <a-entity
        light="type: spot; color: #FFF4D6; intensity: 2; angle: 28; penumbra: 0.35; distance: 12; castShadow: true"
        position="0 5 -1"
        rotation="-35 0 0">
    </a-entity>


    <!-- 3D schelp -->
    <a-entity
        id="schelp"
        gltf-model="#schelpModel"
        position="0 0.5 -4"
        rotation="0 30 0"
        scale="12 12 12"
        sound="src: #schelpGeluid"
        shadow="cast: true; receive: true"
        animation="property: rotation; to: 0 390 0; loop: true; dur: 8000; easing: linear"
        animation__float="property: position; dir: alternate; to: 0 0.8 -4; loop: true; dur: 2000; easing: easeInOutSine"
        interactief-object>
    </a-entity>


    <!-- Stranddetails: simpele duinen en waterbeweging -->
    <a-sphere
        position="-4 -0.1 -7"
        scale="3 0.45 1.3"
        color="#DDBD62"
        shadow="cast: true; receive: true">
    </a-sphere>

    <a-sphere
        position="4 -0.1 -8"
        scale="3.5 0.5 1.5"
        color="#DDBD62"
        shadow="cast: true; receive: true">
    </a-sphere>

    <!-- Bewegende golf voor meer sfeer -->
    <a-box
        position="0 0.08 -9"
        width="18"
        height="0.05"
        depth="0.35"
        color="#BDEBFF"
        opacity="0.75"
        animation="property: position; dir: alternate; to: 0 0.08 -8.3; loop: true; dur: 2200; easing: easeInOutSine">
    </a-box>


    <!-- Camera -->
    <a-camera
        near="0.1"
        far="1000"
        position="0 1.6 1">

        <a-cursor color="black"></a-cursor>

    </a-camera>

</a-scene>

</body>
</html>
